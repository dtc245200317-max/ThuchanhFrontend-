<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tìm kiếm</title>
</head>
<body>

    <h2>Tìm kiếm với Google</h2>

    <!-- Form gửi từ khóa tìm kiếm sang Google bằng phương thức GET -->
    <form action="https://www.google.com.vn/search" method="GET"> 
        <input type="text" name="q" placeholder="Nhập từ khóa..."/>
        <input type="submit" value="Tìm kiếm"/>
    </form>

</body>
</html>
