<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng bộ chọn CSS</title>
    <!-- Liên kết tệp CSS bên ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tiêu đề chính sử dụng ID Selector -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Đoạn văn mô tả bản thân sử dụng Class Selector -->
    <p class="description">
        Xin chào! Tôi là một lập trình viên yêu thích công nghệ và phát triển giao diện Web. Tôi luôn tìm tòi học hỏi các kỹ thuật thiết kế trang web đẹp mắt và tối ưu trải nghiệm người dùng.
    </p>

    <!-- Danh sách sở thích sử dụng kết hợp Class và Pseudo-class Selector -->
    <div class="hobbies-container">
        <h2>Sở thích của tôi</h2>
        <ul class="hobby-list">
            <li class="hobby-item">Đọc sách công nghệ</li>
            <li class="hobby-item">Lập trình Web Frontend</li>
            <li class="hobby-item">Nghe nhạc thư giãn</li>
        </ul>
    </div>

    <!-- Nút bấm sử dụng Class Selector và Hover Pseudo-class -->
    <button id="btn-click" class="btn-primary">Nhấn vào đây</button>

</body>
</html>
