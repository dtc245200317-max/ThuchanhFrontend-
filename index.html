<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS flex-flow Property</title>
    <!-- Liên kết tệp CSS bên ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="page-title">Thực Hành Thuộc Tính flex-flow</h1>

    <!-- Ví dụ 1: flex-flow: row nowrap -->
    <section class="example-box">
        <h2>Ví dụ 1: flex-flow: row nowrap (Mặc định - Trái qua Phải, không xuống dòng)</h2>
        <div class="container container-1">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </section>

    <!-- Ví dụ 2: flex-flow: row-reverse nowrap -->
    <section class="example-box">
        <h2>Ví dụ 2: flex-flow: row-reverse nowrap (Đảo hướng - Phải qua Trái, không xuống dòng)</h2>
        <div class="container container-2">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </section>

</body>
</html>
