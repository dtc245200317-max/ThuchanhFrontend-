<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <!-- Liên kết tệp CSS bên ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="title">Bộ Sưu Tập Ảnh Responsive (RWD Gallery)</h1>

    <!-- Khung chứa bộ sưu tập ảnh -->
    <div class="gallery-container">

        <div class="gallery-item">
            <div class="card">
                <img src="https://picsum.photos/id/1015/600/400" alt="Phong cảnh thiên nhiên">
                <div class="desc">Thiên nhiên tươi đẹp</div>
            </div>
        </div>

        <div class="gallery-item">
            <div class="card">
                <img src="https://picsum.photos/id/1018/600/400" alt="Dãy núi hùng vĩ">
                <div class="desc">Dãy núi hùng vĩ</div>
            </div>
        </div>

        <div class="gallery-item">
            <div class="card">
                <img src="https://picsum.photos/id/1025/600/400" alt="Động vật hoang dã">
                <div class="desc">Động vật hoang dã</div>
            </div>
        </div>

        <div class="gallery-item">
            <div class="card">
                <img src="https://picsum.photos/id/1039/600/400" alt="Thành phố hiện đại">
                <div class="desc">Thành phố về đêm</div>
            </div>
        </div>

        <div class="gallery-item">
            <div class="card">
                <img src="https://picsum.photos/id/1043/600/400" alt="Bờ biển trong xanh">
                <div class="desc">Bờ biển trong xanh</div>
            </div>
        </div>

        <div class="gallery-item">
            <div class="card">
                <img src="https://picsum.photos/id/1050/600/400" alt="Cánh đồng bao la">
                <div class="desc">Cánh đồng mùa thu</div>
            </div>
        </div>

        <div class="gallery-item">
            <div class="card">
                <img src="https://picsum.photos/id/1069/600/400" alt="Rừng cây xanh mát">
                <div class="desc">Rừng cây nhiệt đới</div>
            </div>
        </div>

        <div class="gallery-item">
            <div class="card">
                <img src="https://picsum.photos/id/1084/600/400" alt="Sinh vật biển">
                <div class="desc">Khám phá đại dương</div>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 CodeGym Việt Nam - Responsive Image Gallery Exercise</p>
    </footer>

</body>
</html>
