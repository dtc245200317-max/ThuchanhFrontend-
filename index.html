<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Ký - Bootstrap Forms</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Tệp CSS Tùy Chỉnh -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Thẻ bọc Form Đăng Ký -->
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Tiêu đề Form -->
                        <h2 class="text-center fw-bold text-primary mb-2">Đăng Ký Tài Khoản</h2>
                        <p class="text-center text-muted mb-4">Vui lòng điền đầy đủ thông tin bên dưới để tạo tài khoản mới</p>

                        <form id="registerForm">
                            <!-- 1. Họ và tên -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-medium">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A" required>
                            </div>

                            <!-- 2. Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-medium">Địa chỉ Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" placeholder="nguyenvana@gmail.com" required>
                                <div class="form-text text-muted">Chúng tôi cam kết bảo mật địa chỉ email của bạn.</div>
                            </div>

                            <!-- 3. Mật khẩu -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-medium">Mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="password" placeholder="Tối thiểu 8 ký tự" required>
                            </div>

                            <!-- 4. Xác nhận mật khẩu -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label fw-medium">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                            </div>

                            <!-- 5. Giới tính (Radio Button) -->
                            <div class="mb-3">
                                <label class="form-label fw-medium d-block">Giới tính <span class="text-danger">*</span></label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                    <label class="form-check-label" for="genderMale">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                    <label class="form-check-label" for="genderFemale">Nữ</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                    <label class="form-check-label" for="genderOther">Khác</label>
                                </div>
                            </div>

                            <!-- 6. Sở thích (Checkbox) -->
                            <div class="mb-3">
                                <label class="form-label fw-medium d-block">Sở thích</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                                    <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                    <label class="form-check-label" for="hobbySports">Thể thao</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyCoding" value="coding" checked>
                                    <label class="form-check-label" for="hobbyCoding">Lập trình</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyTravel" value="travel">
                                    <label class="form-check-label" for="hobbyTravel">Du lịch</label>
                                </div>
                            </div>

                            <!-- 7. Quốc gia (Dropdown Select) -->
                            <div class="mb-4">
                                <label for="country" class="form-label fw-medium">Quốc gia <span class="text-danger">*</span></label>
                                <select class="form-select" id="country" required>
                                    <option value="" selected disabled>-- Chọn quốc gia --</option>
                                    <option value="VN">Việt Nam</option>
                                    <option value="US">Mỹ (United States)</option>
                                    <option value="JP">Nhật Bản</option>
                                    <option value="KR">Hàn Quốc</option>
                                    <option value="SG">Singapore</option>
                                </select>
                            </div>

                            <!-- Điều khoản & Dịch vụ -->
                            <div class="mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="terms" required>
                                    <label class="form-check-label text-muted small" for="terms">
                                        Tôi đồng ý với <a href="#" class="text-primary text-decoration-none">Điều khoản sử dụng</a> và <a href="#" class="text-primary text-decoration-none">Chính sách bảo mật</a>.
                                    </label>
                                </div>
                            </div>

                            <!-- 8. Nút Submit -->
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Đăng Ký Tài Khoản</button>
                        </form>

                        <!-- Đã có tài khoản -->
                        <p class="text-center text-muted small mt-4 mb-0">
                            Đã có tài khoản? <a href="#" class="text-primary fw-bold text-decoration-none">Đăng nhập ngay</a>
                        </p>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JavaScript Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
